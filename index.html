<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mechanical Assembly | Marker AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #panel { position: fixed; z-index: 100; top: 12px; left: 5%; width: 90%;
      box-sizing: border-box; border-radius: 12px; padding: 12px 14px;
      color: white; background: rgba(12, 25, 42, .84); text-align: center;
      font-size: 14px; line-height: 1.45; pointer-events: none; }
    #panel strong { display: block; font-size: 16px; margin-bottom: 3px; }
    #help { position: fixed; z-index: 100; bottom: 18px; left: 8%; width: 84%;
      background: rgba(12,25,42,.72); color: #fff; border-radius: 8px;
      padding: 8px; text-align: center; box-sizing: border-box; font-size: 12px;
      pointer-events: none; }
  </style>
</head>
<body>
  <div id="panel" role="status" aria-live="polite">
    <strong>Mechanical Assembly — Augmented Reality</strong>
    <span id="status">Initializing camera and loading assembly...</span>
  </div>
  <div id="help">Point the camera at the printed HIRO marker. Keep its entire black border in view.</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="antialias: true; colorManagement: true;"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="hiroMarker" preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
      <!-- MODEL: Keep assembly.glb in the same GitHub folder as index.html. -->
      <!-- If too big/small change all three numbers in scale equally. -->
      <a-entity id="cadModel" gltf-model="url(./assembly.glb)"
                position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
      <a-light type="ambient" color="#FFFFFF" intensity="1.1"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="1.0" position="-1 2 1"></a-light>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const status = document.getElementById('status');
      const marker = document.getElementById('hiroMarker');
      const model = document.getElementById('cadModel');
      let loaded = false;
      let detected = false;
      let failed = false;
      function refresh() {
        if (failed) return;
        status.textContent = !loaded
          ? 'Loading assembly.glb — check your internet connection...'
          : detected
            ? 'HIRO marker detected — assembly should be visible.'
            : 'Model loaded. Point the camera at the HIRO marker.';
      }
      model.addEventListener('model-loaded', function () { loaded = true; refresh(); });
      model.addEventListener('model-error', function (e) {
        failed = true;
        status.textContent = 'Could not load assembly.glb. Check its exact filename and location on GitHub.';
        console.error('GLB loading error:', e.detail);
      });
      marker.addEventListener('markerFound', function () { detected = true; refresh(); });
      marker.addEventListener('markerLost', function () { detected = false; refresh(); });
      refresh();
    });
  </script>
</body>
</html>

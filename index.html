
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mechanical Engineering | AR Presentation</title>

  <!-- A-Frame 3D Engine -->
  <script
    src="https://aframe.io/releases/1.6.0/aframe.min.js">
  </script>

  <!-- AR.js Marker Tracking -->
  <script
    src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js">
  </script>

  <!-- Animation support for GLB models -->
  <script
    src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #header {
      position: fixed;
      top: 10px;
      left: 5%;
      width: 90%;
      background: rgba(10, 25, 45, 0.85);
      color: white;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      z-index: 1000;
      pointer-events: none;
    }

    #header h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    #header p {
      margin: 0;
      font-size: 12px;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      text-align: center;
      border-radius: 10px;
      font-size: 13px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Presentation Header -->
  <div id="header">
    <h3>Mechanical Engineering</h3>
    <p>SolidWorks 2024 | Augmented Reality</p>
  </div>

  <!-- Status Display -->
  <div id="status">
    Initializing AR experience...
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;
              colorManagement: true;"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          trackingMethod: best;">

    <!-- Load CAD Assembly -->
    <a-assets timeout="60000">
      <a-asset-item
        id="cadAssembly"
        src="./assembly.glb">
      </a-asset-item>
    </a-assets>

    <!-- Lighting -->
    <a-entity
      light="type: ambient;
             color: #ffffff;
             intensity: 1.1">
    </a-entity>

    <a-entity
      light="type: directional;
             color: #ffffff;
             intensity: 1.2"
      position="1 3 2">
    </a-entity>

    <!-- HIRO Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2">

      <!-- SolidWorks CAD Assembly -->
      <a-entity
        id="assemblyModel"
        gltf-model="#cadAssembly"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
        animation-mixer="clip: *;
                         loop: repeat;
                         timeScale: 1">
      </a-entity>

    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const status =
        document.getElementById("status");

      const marker =
        document.getElementById("hiroMarker");

      const model =
        document.getElementById("assemblyModel");

      let modelLoaded = false;
      let markerVisible = false;

      function updateStatus() {

        if (modelLoaded && markerVisible) {
          status.textContent =
            "Assembly visible in Augmented Reality";
        }

        else if (modelLoaded) {
          status.textContent =
            "Model loaded. Point camera at HIRO marker.";
        }

        else if (markerVisible) {
          status.textContent =
            "HIRO marker detected. Loading assembly...";
        }

        else {
          status.textContent =
            "Loading model. Point camera at HIRO marker.";
        }
      }

      // Model loaded successfully
      model.addEventListener("model-loaded", function () {

        modelLoaded = true;

        console.log("SolidWorks GLB loaded successfully");

        updateStatus();
      });

      // Model loading error
      model.addEventListener("model-error", function (event) {

        status.textContent =
          "ERROR: Could not load assembly.glb";

        console.error(
          "GLB model error:",
          event.detail
        );
      });

      // Marker detected
      marker.addEventListener("markerFound", function () {

        markerVisible = true;

        console.log("HIRO marker detected");

        updateStatus();
      });

      // Marker lost
      marker.addEventListener("markerLost", function () {

        markerVisible = false;

        console.log("HIRO marker lost");

        updateStatus();
      });

      updateStatus();

    });
  </script>

</body>
</html>

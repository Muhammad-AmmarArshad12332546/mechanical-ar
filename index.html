<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover">

  <title>Mechanical Engineering | Air Purifier AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <!-- Optional GLB animation support -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Do not override the AR.js video or canvas sizing */

    #header {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      width: auto;
      max-width: calc(100% - 16px);
      z-index: 10000;
      background: rgba(12, 27, 48, 0.85);
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      pointer-events: none;
    }

    #header h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
    }

    #header p {
      margin: 4px 0 0;
      font-size: 11px;
      line-height: 1.4;
    }

    #controls {
      position: fixed;
      top: 80px;
      left: 8px;
      right: 8px;
      z-index: 10001;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    button {
      background: #183b65;
      color: white;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button.active {
      background: #137a4a;
      border-color: #70d6a2;
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 8px;
      right: 8px;
      width: auto;
      max-width: calc(100% - 16px);
      z-index: 10000;
      background: rgba(0,0,0,0.82);
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
      overflow-wrap: anywhere;
    }

    #status.error {
      background: rgba(130, 15, 15, 0.9);
    }

    #status.success {
      background: rgba(12, 91, 54, 0.9);
    }

    @media (max-width: 480px) {
      #header h3 {
        font-size: 13px;
      }

      #header p {
        font-size: 10px;
      }

      #controls {
        top: 72px;
      }

      button {
        font-size: 12px;
        padding: 9px 12px;
      }

      #status {
        font-size: 11px;
        bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <h3>Mechanical Engineering | Air Purifier</h3>
    <p>SolidWorks 2024 - Augmented Reality</p>
  </div>

  <!-- Test controls -->
  <div id="controls">
    <button id="cubeBtn">
      Test Cube
    </button>

    <button id="modelBtn" class="active">
      CAD Model
    </button>
  </div>

  <!-- Status -->
  <div id="status">
    Starting AR camera...
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          trackingMethod: best;"
    renderer="antialias: true;
              colorManagement: true;">

    <!-- Lighting -->
    <a-entity
      light="type: ambient;
             color: #ffffff;
             intensity: 1.5">
    </a-entity>

    <a-entity
      light="type: directional;
             color: #ffffff;
             intensity: 1.2"
      position="2 4 3">
    </a-entity>

    <!-- HIRO Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true">

      <!-- Red Cube for testing -->
      <a-box
        id="testCube"
        position="0 0.25 0"
        scale="0.5 0.5 0.5"
        color="#ff3030"
        visible="false">
      </a-box>

      <!-- SolidWorks Assembly -->
      <a-entity
        id="assemblyModel"
        gltf-model="url(./assembly.glb)"
        animation-mixer="clip: *; loop: repeat"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
        visible="false">
      </a-entity>

    </a-marker>

    <!-- AR Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const status = document.getElementById("status");
      const marker = document.getElementById("hiroMarker");
      const model = document.getElementById("assemblyModel");
      const cube = document.getElementById("testCube");

      const cubeBtn = document.getElementById("cubeBtn");
      const modelBtn = document.getElementById("modelBtn");

      const scene = document.querySelector("a-scene");

      let mode = "model";
      let markerDetected = false;
      let modelLoaded = false;
      let modelError = false;
      let cameraError = false;

      function setStatus(message, type = "") {
        status.textContent = message;
        status.className = type;
      }

      function updateStatus() {

        if (cameraError) {
          setStatus(
            "Camera initialization failed. Check browser permissions.",
            "error"
          );
          return;
        }

        if (mode === "cube") {

          if (markerDetected) {
            setStatus(
              "HIRO detected - red test cube active.",
              "success"
            );
          } else {
            setStatus(
              "Test Cube mode - point camera at HIRO marker."
            );
          }

          return;
        }

        if (modelError) {
          setStatus(
            "GLB error. Check assembly.glb in GitHub.",
            "error"
          );
          return;
        }

        if (!modelLoaded) {
          setStatus(
            markerDetected
              ? "HIRO detected - loading CAD assembly..."
              : "Loading CAD assembly - scan HIRO marker."
          );
          return;
        }

        if (markerDetected) {
          setStatus(
            "CAD assembly loaded - HIRO marker detected.",
            "success"
          );
        } else {
          setStatus(
            "CAD model ready - point camera at HIRO marker."
          );
        }
      }

      function setMode(nextMode) {

        mode = nextMode;

        const showCube = mode === "cube";
        const showModel = !showCube && modelLoaded;

        cube.setAttribute("visible", showCube);
        model.setAttribute("visible", showModel);

        cubeBtn.classList.toggle("active", showCube);
        modelBtn.classList.toggle("active", !showCube);

        updateStatus();
      }

      cubeBtn.addEventListener("click", function () {
        setMode("cube");
      });

      modelBtn.addEventListener("click", function () {
        setMode("model");
      });

      // Marker detected
      marker.addEventListener("markerFound", function () {
        markerDetected = true;
        updateStatus();
      });

      // Marker lost
      marker.addEventListener("markerLost", function () {
        markerDetected = false;
        updateStatus();
      });

      // CAD model loaded
      model.addEventListener("model-loaded", function () {

        modelLoaded = true;
        modelError = false;

        console.log("SolidWorks assembly loaded.");

        // Automatically fit assembly to marker size
        try {
          const object = model.getObject3D("mesh");

          if (object) {
            object.updateMatrixWorld(true);

            const box = new THREE.Box3().setFromObject(object);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const maxSize = Math.max(
              size.x,
              size.y,
              size.z
            );

            if (maxSize > 0 && Number.isFinite(maxSize)) {

              // Longest model dimension becomes
              // approximately 1 marker coordinate unit.
              const scaleFactor = 1.0 / maxSize;

              object.scale.multiplyScalar(scaleFactor);

              // Center model above the marker plane
              object.position.x -= center.x * scaleFactor;
              object.position.y -= box.min.y * scaleFactor;
              object.position.z -= center.z * scaleFactor;

              console.log(
                "Model normalized. Scale:",
                scaleFactor
              );
            }
          }

        } catch (e) {
          console.warn("Automatic fitting failed:", e);
        }

        setMode(mode);
      });

      // GLB error
      model.addEventListener("model-error", function (event) {

        modelError = true;

        console.error(
          "Could not load assembly.glb:",
          event.detail
        );

        updateStatus();
      });

      // AR scene ready
      scene.addEventListener("loaded", function () {
        console.log("AR scene initialized.");
        updateStatus();
      });

      // Camera error
      window.addEventListener("error", function (event) {
        console.error("Page error:", event.message);
      });

      // Initial UI
      setMode("model");

    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover">

  <title>Air Purifier | Augmented Reality</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js: Hiro marker tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #controls {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      padding: 12px;
      background: rgba(12, 27, 45, 0.88);
      color: white;
      text-align: center;
      border-radius: 10px;
    }

    h3 {
      margin: 0 0 5px;
      font-size: 15px;
    }

    #subtitle {
      margin: 0 0 10px;
      font-size: 11px;
      color: #d2dfeb;
    }

    button {
      padding: 10px 14px;
      margin: 3px;
      border: 1px solid #60758a;
      border-radius: 7px;
      background: #173c67;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    button.active {
      background: #087c55;
    }

    #status {
      position: fixed;
      bottom: 15px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      text-align: center;
      border-radius: 8px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div id="controls">
    <h3>Mechanical Engineering | Air Purifier</h3>
    <p id="subtitle">
      SolidWorks 2024 | Marker-Based AR
    </p>

    <button id="cubeBtn" class="active">
      Test Cube
    </button>

    <button id="modelBtn">
      View Air Purifier
    </button>
  </div>

  <div id="status">
    Starting AR camera...
  </div>

  <!-- No preloaded GLB assets -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
          debugUIEnabled: false;"
    renderer="antialias: true;">

    <!-- Lighting -->
    <a-entity
      light="type: ambient;
             color: #ffffff;
             intensity: 1.4">
    </a-entity>

    <a-entity
      light="type: directional;
             color: #ffffff;
             intensity: 1.1"
      position="2 4 3">
    </a-entity>

    <!-- Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true">

      <!-- Diagnostic cube -->
      <a-box
        id="testCube"
        position="0 0.25 0"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="#ff3333">
      </a-box>

      <!-- Air Purifier model container -->
      <a-entity
        id="modelContainer"
        visible="false">

        <a-entity
          id="airPurifier"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1">
        </a-entity>

      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const status =
        document.getElementById("status");

      const marker =
        document.getElementById("hiroMarker");

      const cube =
        document.getElementById("testCube");

      const container =
        document.getElementById("modelContainer");

      const model =
        document.getElementById("airPurifier");

      const cubeBtn =
        document.getElementById("cubeBtn");

      const modelBtn =
        document.getElementById("modelBtn");

      let mode = "cube";
      let markerVisible = false;
      let modelLoaded = false;
      let modelLoading = false;
      let modelError = "";

      function message(text) {
        status.textContent = text;
      }

      function updateStatus() {

        if (mode === "cube") {
          message(
            markerVisible
              ? "HIRO detected. Red cube should be visible."
              : "Point camera at the HIRO marker."
          );
          return;
        }

        if (modelError) {
          message("Model error: " + modelError);
          return;
        }

        if (modelLoading) {
          message("Loading air purifier assembly...");
          return;
        }

        if (modelLoaded) {
          message(
            markerVisible
              ? "Air purifier loaded. Marker detected."
              : "Model ready. Scan the HIRO marker."
          );
          return;
        }

        message("Preparing CAD model...");
      }

      function setMode(nextMode) {

        mode = nextMode;

        cube.setAttribute(
          "visible",
          mode === "cube"
        );

        container.setAttribute(
          "visible",
          mode === "model"
        );

        cubeBtn.classList.toggle(
          "active",
          mode === "cube"
        );

        modelBtn.classList.toggle(
          "active",
          mode === "model"
        );

        updateStatus();
      }

      // Marker tracking events
      marker.addEventListener(
        "markerFound",
        () => {
          markerVisible = true;
          updateStatus();
        }
      );

      marker.addEventListener(
        "markerLost",
        () => {
          markerVisible = false;
          updateStatus();
        }
      );

      // Test cube
      cubeBtn.addEventListener("click", () => {
        setMode("cube");
      });

      // Air purifier
      modelBtn.addEventListener("click", () => {

        setMode("model");

        if (
          !modelLoaded &&
          !modelLoading &&
          !modelError
        ) {

          modelLoading = true;
          updateStatus();

          // Load the GLB only on demand
          model.setAttribute(
            "gltf-model",
            "url(./assembly.glb)"
          );
        }
      });

      // Model loaded successfully
      model.addEventListener("model-loaded", () => {

        modelLoaded = true;
        modelLoading = false;

        try {

          const mesh = model.getObject3D("mesh");

          if (mesh) {

            mesh.updateMatrixWorld(true);

            const bounds =
              new THREE.Box3().setFromObject(mesh);

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            bounds.getSize(size);
            bounds.getCenter(center);

            const maxSize = Math.max(
              size.x,
              size.y,
              size.z
            );

            if (
              maxSize > 0 &&
              Number.isFinite(maxSize)
            ) {

              // Fit the model to the marker
              const factor = 0.85 / maxSize;

              mesh.scale.setScalar(factor);

              // Centre horizontally and lift base
              mesh.position.set(
                -center.x * factor,
                -bounds.min.y * factor,
                -center.z * factor
              );
            }
          }

        } catch (error) {
          console.warn(
            "Automatic fitting failed:",
            error
          );
        }

        updateStatus();
      });

      // Model loading error
      model.addEventListener("model-error", event => {

        modelLoading = false;

        modelError =
          "assembly.glb could not be loaded.";

        console.error(
          "GLB loading error:",
          event.detail
        );

        updateStatus();
      });

      // Report browser errors
      window.addEventListener("error", event => {
        console.error("Page error:", event.message);
      });

      setMode("cube");
    });
  </script>

</body>
</html>

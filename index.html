<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mechanical Engineering | Marker AR Test</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
    #status { position:fixed; z-index:1000; top:12px; left:5%; width:90%; box-sizing:border-box;
      text-align:center; background:rgba(10,22,38,.83); color:#fff; border-radius:10px; padding:12px 8px;
      font-size:15px; pointer-events:none; }
    #help { position:fixed; z-index:1000; bottom:16px; left:5%; width:90%; box-sizing:border-box;
      text-align:center; background:rgba(10,22,38,.75); color:#fff; border-radius:10px; padding:10px;
      font-size:13px; pointer-events:none; }
  </style>
</head>
<body>
  <div id="status" role="status">Starting AR test. Allow camera access if prompted.</div>
  <div id="help">Point your camera at the printed HIRO marker. Keep the entire black border visible.</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="antialias: true; colorManagement: true"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="hiro" preset="hiro" emitevents="true">
      <!-- A simple opaque red cube, positioned above the marker -->
      <a-box position="0 0.5 0" width="0.7" height="0.7" depth="0.7"
             material="color: #FF2020; opacity: 1; side: double"></a-box>
      <a-box position="0 0.03 0" width="0.9" height="0.06" depth="0.9"
             material="color: #FFFFFF; opacity: 1"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const marker = document.getElementById('hiro');
    marker.addEventListener('markerFound', () => {
      status.textContent = 'HIRO marker detected — the RED CUBE should be visible.';
      status.style.background = 'rgba(11,96,56,.88)';
    });
    marker.addEventListener('markerLost', () => {
      status.textContent = 'Looking for HIRO marker. Keep it flat and fully in view.';
      status.style.background = 'rgba(10,22,38,.83)';
    });
    document.querySelector('a-scene').addEventListener('loaded', () => {
      status.textContent = 'AR scene loaded. Allow camera permission, then scan HIRO marker.';
    });
  </script>
</body>
</html>

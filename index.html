
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0">

  <title>Mechanical Engineering | Air Purifier AR</title>

  <!-- A-Frame -->
  <script
    src="https://aframe.io/releases/1.6.0/aframe.min.js">
  </script>

  <!-- AR.js -->
  <script
    src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js">
  </script>

  <!-- GLB Animation Support -->
  <script
    src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100dvh !important;
      overflow: hidden;
    }

    /* AR.js camera sizing */
    video {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 100vw !important;
      height: 100dvh !important;
      object-fit: contain !important;
    }

    /* WebGL rendering canvas */
    canvas.a-canvas {
      width: 100vw !important;
      height: 100dvh !important;
    }

    #header {
      position: fixed;
      top: 12px;
      left: 5%;
      width: 90%;
      padding: 12px;
      z-index: 10000;
      color: white;
      text-align: center;
      background: rgba(9, 27, 49, 0.86);
      border-radius: 10px;
      pointer-events: none;
    }

    #header h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    #header p {
      margin: 0;
      font-size: 12px;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 5%;
      width: 90%;
      padding: 12px;
      z-index: 10000;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="header">
    <h3>Mechanical Engineering</h3>
    <p>Air Purifier | Augmented Reality</p>
  </div>

  <div id="status">
    Initializing camera and loading assembly...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;
              colorManagement: true;
              antialias: true;"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          trackingMethod: best;
          sourceWidth: 640;
          sourceHeight: 480;
          displayWidth: 640;
          displayHeight: 480;">

    <!-- Model Asset -->
    <a-assets timeout="60000">
      <a-asset-item
        id="cadAssembly"
        src="./assembly.glb">
      </a-asset-item>
    </a-assets>

    <!-- Lighting -->
    <a-entity
      light="type: ambient;
             intensity: 1.2;
             color: #ffffff">
    </a-entity>

    <a-entity
      light="type: directional;
             intensity: 1.3;
             color: #ffffff"
      position="2 4 3">
    </a-entity>

    <!-- Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2">

      <!-- Your SolidWorks Air Purifier -->
      <a-entity
        id="assemblyModel"
        gltf-model="#cadAssembly"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
        animation-mixer="clip: *;
                         loop: repeat;
                         timeScale: 1">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const status =
        document.getElementById("status");

      const marker =
        document.getElementById("hiroMarker");

      const model =
        document.getElementById("assemblyModel");

      let modelLoaded = false;
      let markerVisible = false;
      let loadingError = false;

      function updateStatus() {

        if (loadingError) {
          status.textContent =
            "Error loading assembly.glb. Check GitHub files.";
          return;
        }

        if (modelLoaded && markerVisible) {
          status.textContent =
            "Air Purifier visible in Augmented Reality";
        }

        else if (modelLoaded) {
          status.textContent =
            "Model loaded. Point camera at HIRO marker.";
        }

        else if (markerVisible) {
          status.textContent =
            "HIRO marker detected. Loading assembly...";
        }

        else {
          status.textContent =
            "Loading assembly. Point camera at HIRO marker.";
        }
      }

      model.addEventListener("model-loaded", function () {
        modelLoaded = true;
        console.log("GLB model loaded");
        updateStatus();
      });

      model.addEventListener("model-error", function (event) {
        loadingError = true;
        console.error("Model loading failed:", event.detail);
        updateStatus();
      });

      marker.addEventListener("markerFound", function () {
        markerVisible = true;
        updateStatus();
      });

      marker.addEventListener("markerLost", function () {
        markerVisible = false;
        updateStatus();
      });

      updateStatus();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Air Purifier Augmented Reality</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    #header {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      width: auto;
      padding: 10px;
      background: rgba(10, 25, 45, 0.8);
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
    }

    #status {
      position: fixed;
      bottom: 15px;
      left: 10px;
      right: 10px;
      width: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="header">
    Mechanical Engineering | Air Purifier AR
  </div>

  <div id="status">
    Starting AR camera...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true">

      <a-entity
        id="assemblyModel"
        gltf-model="url(./assembly.glb)"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const status =
          document.getElementById("status");

        const marker =
          document.getElementById("hiroMarker");

        const model =
          document.getElementById("assemblyModel");

        let loaded = false;
        let detected = false;
        let error = false;

        function update() {
          if (error) {
            status.textContent =
              "Model error: Check assembly.glb";
          } else if (loaded && detected) {
            status.textContent =
              "Model loaded and marker detected";
          } else if (detected) {
            status.textContent =
              "HIRO detected. Loading model...";
          } else if (loaded) {
            status.textContent =
              "Model ready. Scan HIRO marker.";
          } else {
            status.textContent =
              "Starting camera / loading model...";
          }
        }

        model.addEventListener(
          "model-loaded",
          function () {
            loaded = true;
            update();
          }
        );

        model.addEventListener(
          "model-error",
          function (e) {
            error = true;
            console.error(e.detail);
            update();
          }
        );

        marker.addEventListener(
          "markerFound",
          function () {
            detected = true;
            update();
          }
        );

        marker.addEventListener(
          "markerLost",
          function () {
            detected = false;
            update();
          }
        );

        update();
      }
    );
  </script>

</body>
</html>
